<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Bài 01 - Trang thơ Bốn mùa</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #f5f5f5;
        font-family: Arial, sans-serif;
      }
      .khung-tho {
        width: 640px;
        max-width: calc(100% - 32px);
        box-sizing: border-box;
        padding: 24px;
        background-color: #fffde7;
        border: 1px solid #9e9e9e;
        text-align: center;
      }
      h1 {
        color: #d40000;
        background-color: #ffd9e6;
        font-size: 26px;
        font-weight: bold;
        padding: 6px 0;
        margin: 0 0 20px;
      }
      .kho {
        font-style: italic;
        line-height: 1.7;
        margin: 0;
      }
      .kho-xanh {
        color: #0033cc;
      }
      .kho-do {
        color: #d40000;
      }
      hr {
        width: 55%;
        border: none;
        border-top: 1px solid #0033cc;
        margin: 18px auto;
      }
      @media (max-width: 480px) {
        .khung-tho {
          padding: 18px 12px;
        }
        h1 {
          font-size: 22px;
        }
      }
    </style>
  </head>
  <body>
    <article class="khung-tho">
      <h1>BỐN MÙA</h1>
      <p class="kho kho-xanh">
        Xuân về hoa nở khắp trời<br />
        Hạ sang nắng cháy rạng ngời phố quen<br />
        Thu về lá rụng bên thềm
      </p>
      <hr />
      <p class="kho kho-do">
        Đông sang gió lạnh bên em đợi chờ<br />
        Bốn mùa là bốn giấc mơ<br />
        Thời gian đi mãi ta chờ đợi ai
      </p>
      <hr />
      <p class="kho kho-xanh">
        Một năm rồi lại một năm<br />
        Vẫn còn câu hát thì thầm quê hương<br />
        Chờ xuân nắng mới soi đường
      </p>
    </article>
  </body>
</html>
